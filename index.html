<section id="register">
  <h2>Create Your EstateLink Account</h2>
  <p>Register to explore properties, investments, and cleaning services.</p>

  <form id="registrationForm">
    <label for="fullName">Full Name</label>
    <input
      type="text"
      id="fullName"
      name="fullName"
      placeholder="Enter your full name"
      required
    >

    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="Enter your email address"
      required
    >

    <label for="phone">Phone Number</label>
    <input
      type="tel"
      id="phone"
      name="phone"
      placeholder="Enter your phone number"
      required
    >

    <label for="password">Create Password</label>
    <input
      type="password"
      id="password"
      name="password"
      placeholder="Create a password"
      minlength="8"
      required
    >

    <button type="submit">Register</button>
    <p id="formMessage" aria-live="polite"></p>
  </form>
</section>

<script>
document.getElementById("registrationForm").addEventListener("submit", function(event) {
  event.preventDefault();

  document.getElementById("formMessage").textContent =
    "Your form is working in preview mode. Account registration is not active yet.";
});
</script>
